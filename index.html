<script>
    // --- ВХОД ---
    function login() {
        const key = document.getElementById('secretKey').value;
        if (key === '1234') {
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('bhInterior').style.display = 'block';
            
            // Запускаем космос с задержкой, чтобы интерфейс успел прогрузиться
            setTimeout(createUniverse, 100);
        } else {
            alert('Ключ неверен.');
        }
    }

    // --- СОЗДАНИЕ КОСМОСА (Универсальный способ) ---
    function createUniverse() {
        const container = document.getElementById('bhInterior');
        const centerX = window.innerWidth / 2;
        const centerY = window.innerHeight / 2;
        const size = Math.min(window.innerWidth, window.innerHeight); // Берем меньшую сторону экрана

        // 1. Черная дыра (по центру)
        const bh = document.createElement('div');
        bh.style.cssText = `
            position: absolute; left: ${centerX}px; top: ${centerY}px;
            width: ${size * 0.2}px; height: ${size * 0.2}px;
            transform: translate(-50%, -50%); border-radius: 50%;
            background: radial-gradient(circle, #000 30%, #2a0a4a 60%, #000 100%);
            box-shadow: 0 0 50px #ff00ff; border: 2px solid #a855f7;
            display: flex; align-items: center; justify-content: center; 
            color: #fff; font-size: 16px; font-weight: bold; text-align: center; z-index: 10;
        `;
        bh.innerText = 'ЧЕРНАЯ ДЫРА';
        container.appendChild(bh);

        // 2. Звезды и планеты
        const systems = ['Аниме', 'Фильмы', 'Сериалы', 'Книги'];
        const colors = ['#fbbf24', '#3b82f6', '#ef4444', '#10b981'];
        const orbitRadius = size * 0.3; // Расстояние от центра до звезд

        systems.forEach((name, i) => {
            const angle = (i / systems.length) * Math.PI * 2;
            const x = Math.cos(angle) * orbitRadius;
            const y = Math.sin(angle) * orbitRadius;

            // Рисуем Звезду
            const star = document.createElement('div');
            star.style.cssText = `
                position: absolute; left: ${centerX + x}px; top: ${centerY + y}px;
                width: ${size * 0.1}px; height: ${size * 0.1}px;
                transform: translate(-50%, -50%);
                background: radial-gradient(circle, #fff, ${colors[i]});
                border-radius: 50%; box-shadow: 0 0 30px ${colors[i]};
                display: flex; align-items: center; justify-content: center;
                font-size: 12px; color: #000; font-weight: bold; z-index: 5;
            `;
            star.innerText = name;
            container.appendChild(star);

            // Рисуем Планету на орбите
            const planetDist = size * 0.12;
            const planet = document.createElement('div');
            planet.style.cssText = `
                position: absolute; left: ${centerX + x}px; top: ${centerY + y}px;
                width: ${size * 0.04}px; height: ${size * 0.04}px;
                background: #a78bfa; border-radius: 50%; border: 1px solid #fff;
                z-index: 4; 
                transform-origin: 0px 0px;
                animation: orbitMove ${10 + i * 2}s linear infinite;
            `;
            planet.style.transform = `translate(${planetDist}px, 0px)`; // Стартовое положение
            container.appendChild(planet);
        });

        // 3. Зено
        setTimeout(() => triggerZenoLogic(), 2000);
    }

    // --- АНИМАЦИЯ ДВИЖЕНИЯ ПЛАНЕТ ---
    const styleSheet = document.createElement("style");
    styleSheet.textContent = `
        @keyframes orbitMove {
            from { transform: rotate(0deg) translateX(0px); }
            to { transform: rotate(360deg) translateX(0px); }
        }
    `;
    document.head.appendChild(styleSheet);

    // --- ЛОГИКА ЗЕНО ---
    const zenoQuestions = [
        "Парадокс думает, что он самый умный. Но мы-то знаем, кто тут Создатель, да?",
        "Слушай, а Парадокс там снаружи всё еще грустит?",
        "Я смотрю, ты новую планету создал. Круто!"
    ];

    function triggerZenoLogic() {
        const bubble = document.getElementById('zenoSpeechBubble');
        const textZone = document.getElementById('zenoText');
        
        if (Math.random() * 100 <= 65) {
            textZone.innerText = zenoQuestions[Math.floor(Math.random() * zenoQuestions.length)];
            bubble.style.display = 'block';
        }
    }

    function closeZenoDialog() {
        document.getElementById('zenoSpeechBubble').style.display = 'none';
    }
        </script>
